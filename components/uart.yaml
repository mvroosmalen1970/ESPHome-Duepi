# Define UART pinout RX: GPIO-3 (D9) & TX: GPIO-1 (D10)
# 0x00DE & 0x00EA observed as unknown ==> off
uart:
  id: uart_bus
  tx_pin: ${tx_pin_esp}
  rx_pin: ${rx_pin_esp}
  baud_rate: 115200
  debug:
    direction: RX
    dummy_receiver: true
    after:
      timeout: 50ms
      delimiter: "&"
    sequence:
      - lambda: |-
            UARTDebug::log_string(direction, bytes);
            // Convert uart text to string
            std::string data_from_server(bytes.begin(), bytes.end());
            // Buffer for firmware 9.3.x
            static std::string rx_acc;
            static uint32_t last_fragment_time = 0;
            uint32_t now = millis();
            // Safety check, Clear buffer if previous fragment > 200ms
            if (!rx_acc.empty() && (now - last_fragment_time > 200)) {
              ESP_LOGW("uart_buffer", "Buffer gewist wegens timeout tussen fragmenten (%d ms)", now - last_fragment_time);
              rx_acc.clear();
            }
            last_fragment_time = now;
            // Start new frame (0x1B is ESC)
            if (!data_from_server.empty() && data_from_server.front() == 0x1B) {
              rx_acc.clear();
            }
            if (data_from_server.empty() || data_from_server.back() != '&') {
              rx_acc += data_from_server;
              // Limit data in case of corrupt data
              if (rx_acc.size() > 250) { 
                rx_acc.clear(); 
              }
              return;
            }
            if (!rx_acc.empty()) {
              data_from_server = rx_acc + data_from_server;
              rx_acc.clear();
            }
            // 10-byte transformation for firmware 9.3.x useable upstream
            if (data_from_server.length() > 10 && data_from_server.front() == 0x1B) {
              data_from_server = data_from_server.substr(0, 7) + data_from_server.substr(data_from_server.length() - 3);
            }
            if (id(uart_send) == 10) {
              // In raw/debug mode, always expose the frame we got back even if it
              // does not match the fixed 10-byte parser used by the runtime flow.
              id(debug_rx).publish_state(data_from_server);
            }
            if (id(expert_bridge_takeover_active)) {
              return;
            }
            if (data_from_server.length() != 10) {
              if (id(uart_send) == 15) {
                const int param = id(installer_pending_param);
                id(installer_status).publish_state(
                    "Read PR" + std::to_string(param) + " failed: unexpected frame");
              } else if (id(uart_send) == 16) {
                const int param = id(installer_pending_param);
                id(installer_status).publish_state(
                    "Write PR" + std::to_string(param) + " failed: unexpected frame");
              } else if (id(uart_send) == 10) {
                id(debug).publish_state("Response :" + data_from_server);
              } else {
                id(debug_rx).publish_state(data_from_server);
                id(debug).publish_state("Unexpected UART frame :" + data_from_server);
              }
              id(installer_pending_param) = -1;
              id(installer_pending_value) = -1;
              id(uart_send) = 0;
              return;
            }
            std::string status;
            status=data_from_server.substr(1, 6);
            unsigned int checksum = 0;
            for (size_t i = 0; i < status.size(); i++) {
              checksum += static_cast<unsigned char>(status[i]);
            }
            checksum = checksum & 0xFF;
            if (data_from_server.substr(7, 2) == str_sprintf("%X", checksum)) {
              switch(id(uart_send)) {
                case 1: {
                  const int STATE_OFF             = 0x0000;
                  const int STATE_IGNITION        = 0x0101;
                  const int STATE_LOAD_WOOD       = 0x0102;
                  const int STATE_FIRE_ON         = 0x0103;
                  const int STATE_FIRE_ON_VENT_ON = 0x0104;
                  const int STATE_FIRE_ON_E693    = 0x0105;
                  const int STATE_DELAYED_ON      = 0x010A;
                  const int STATE_LOAD_WOOD_V100  = 0x0132;
                  const int STATE_IGNITION_V100   = 0x0133;
                  const int STATE_ON_CLEAN        = 0x0200;
                  const int STATE_ON              = 0x0201;
                  const int STATE_STOP_SEQUENCE   = 0x0301;
                  const int STATE_FIRE_CLEAN      = 0x0401;
                  const int STATE_COOLDOWN1       = 0x0801;
                  const int STATE_COOLDOWN2       = 0x0802;
                  const int STATE_ECO             = 0x1000;
                  const int STATE_ECO_COOL1       = 0x1001;
                  const int STATE_ECO_COOL2       = 0x1002;
                  const int STATE_ECO_OFF         = 0x1003;
                  int currentstate = std::stoi(data_from_server.substr(1, 4), nullptr, 16);
                  int kachel_aan = 1;
                  if (STATE_IGNITION == currentstate) { status = "Ignition starting";}
                  else if (STATE_LOAD_WOOD == currentstate) { status = "Ignition starting, load wood"; }
                  else if (STATE_FIRE_ON == currentstate) { status = "Ignition starting, fire on"; }
                  else if (STATE_FIRE_ON_VENT_ON == currentstate) { status = "Ignition starting, fire on and vent"; }
                  else if (STATE_DELAYED_ON == currentstate) { status = "Fire on, wait for cooldown"; }
                  else if (STATE_FIRE_ON_E693 == currentstate) { status = "Ignition starting, fire on E693"; }
                  else if (STATE_LOAD_WOOD_V100 == currentstate) { status = "Ignition starting, load wood (V100)"; }
                  else if (STATE_IGNITION_V100 == currentstate) { status = "Ignition starting (V100)"; }
                  else if (STATE_ON == currentstate) { status = "Stove On"; }
                  else if (STATE_ON_CLEAN == currentstate) { status = "Stove On, Clean"; }
                  else if (STATE_FIRE_CLEAN == currentstate) { status = "Cleaning"; }
                  else if (STATE_ECO == currentstate) { status = "Eco Idle"; }
                  else if (STATE_ECO_COOL1 == currentstate) { status = "Eco Idle, Cooldown sequence 1"; }
                  else if (STATE_ECO_COOL2 == currentstate) { status = "Eco Idle, Cooldown sequence 2"; }
                  else if (STATE_ECO_OFF == currentstate) { status = "Eco Idle, OFF"; }
                  else if (STATE_STOP_SEQUENCE == currentstate) {
                    status = "Stove power off";
                    kachel_aan = 0;
                  } else if (STATE_COOLDOWN1 == currentstate) {
                    status = "Cooldown sequence 1";
                    kachel_aan = 0;
                  } else if (STATE_COOLDOWN2 == currentstate) {
                    status = "Cooldown sequence 2";
                    kachel_aan = 0;
                  } else if (STATE_OFF == currentstate) {
                    status = "Off";
                    kachel_aan = 0;
                  } else {
                    status = "Unknown state "+ std::to_string(currentstate);
                    if (id(Stove).mode == CLIMATE_MODE_OFF) { kachel_aan = 0; }
                  }
                  id(burner_status).publish_state(status);
                  if (kachel_aan == 0 && id(Stove).mode == CLIMATE_MODE_HEAT) {
                    id(climate_sync_in_progress) = true;
                    id(Stove).make_call().set_mode("OFF").perform();
                    id(climate_sync_in_progress) = false;
                    id(debug).publish_state("Off, stove<>climate");
                  } else if (kachel_aan == 1 && id(Stove).mode == CLIMATE_MODE_OFF) {
                    id(climate_sync_in_progress) = true;
                    id(Stove).make_call().set_mode("HEAT").perform();
                    id(climate_sync_in_progress) = false;
                    id(debug).publish_state("HEAT, stove<>climate");
                  }
                  id(boot_restore_in_progress) = false;
                  id(uart_send) = 2;
                  break;
                }
                case 2: {
                  id(room_temp_stove).publish_state(std::stoi(data_from_server.substr(1, 4), nullptr, 16)/10.0);
                  id(uart_send) = 1;
                  break;
                }
                case 3: {
                  id(power_level).publish_state(std::stoi(data_from_server.substr(1, 4), nullptr, 16));
                  id(uart_send) = 1;
                  break;
                }
                case 4: {
                  id(pellet_speed).publish_state(std::stoi(data_from_server.substr(1, 4), nullptr, 16));
                  id(fan_mode) = std::stoi(data_from_server.substr(1, 4), nullptr, 16);
                  // Mirror the stove fan level only when it changes, and under the
                  // sync guard: each call refreshes the thermostat, and its first
                  // refresh after boot fires target_temperature_change_action
                  // (previous target is NaN), which would send the restored target
                  // back to the stove as if the user had changed it.
                  {
                    static const ClimateFanMode FAN_BY_LEVEL[] = {
                        ClimateFanMode::CLIMATE_FAN_QUIET, ClimateFanMode::CLIMATE_FAN_LOW,
                        ClimateFanMode::CLIMATE_FAN_MIDDLE, ClimateFanMode::CLIMATE_FAN_MEDIUM,
                        ClimateFanMode::CLIMATE_FAN_HIGH};
                    if (id(fan_mode) >= 1 && id(fan_mode) <= 5) {
                      const ClimateFanMode wanted = FAN_BY_LEVEL[id(fan_mode) - 1];
                      if (!id(Stove).fan_mode.has_value() || *id(Stove).fan_mode != wanted) {
                        id(climate_sync_in_progress) = true;
                        id(Stove).make_call().set_fan_mode(wanted).perform();
                        id(climate_sync_in_progress) = false;
                      }
                    }
                  }
                  id(uart_send) = 1;
                  break;
                }
                case 5: {
                  id(flu_gas_temp).publish_state(std::stoi(data_from_server.substr(1, 4), nullptr, 16));
                  id(uart_send) = 1;
                  break;
                }
                case 6: {
                  id(exh_fan_speed).publish_state(std::stoi(data_from_server.substr(1, 4), nullptr, 16)*10);
                  id(uart_send) = 1;
                  break;
                }
                case 7: {
                  int err_code = std::stoi(data_from_server.substr(1, 4), nullptr, 16);
                  id(error_code).publish_state(err_code);
                  id(uart_send) = 1;
                  // Errors go to their own sensor so burner_status keeps the phase
                  // instead of alternating with the error text every poll.
                  static const char *const ERROR_TEXT[] = {
                      "OK", "Ignition failure", "Defective suction", "Insufficient air intake",
                      "Water temperature", "Out of pellets", "Defective pressure switch", "Unknown",
                      "No current", "Exhaust motor failure", "Card surge", "Date expired", "Unknown",
                      "Suction regulating sensor error", "Overheating"};
                  const std::string error_text = (err_code >= 0 && err_code <= 14)
                                                     ? std::string(ERROR_TEXT[err_code])
                                                     : "Unknown Error " + std::to_string(err_code);
                  if (!id(stove_error).has_state() || id(stove_error).state != error_text)
                    id(stove_error).publish_state(error_text);
                  id(uart_send) = 1;
                  break;
                }
                case 8: {
                  int temp = std::stoi(data_from_server.substr(1, 4), nullptr, 16);
                  if (temp>= ${min_temp}  && temp <= ${max_temp} ) { id(Stove).target_temperature = temp; }
                  else { id(debug).publish_state("Error temperature out of range :"+temp); }
                  id(uart_send) = 0;
                  break;
                }
                case 9: {
                  int current_state = std::stoi(data_from_server.substr(1, 4), nullptr, 16);
                  if (current_state == 0) { status = "OK"; }
                  else { status = "Unknown return value "+ data_from_server; }
                  id(debug).publish_state(status);
                  id(uart_send) = 0;
                  break;
                }
                case 10: {
                  id(debug_rx).publish_state(data_from_server);
                  id(debug).publish_state("Response :"+data_from_server);
                  id(uart_send) = 0;
                  break;
                }
                case 11: {
                  id(PCB_temp).publish_state(std::stoi(data_from_server.substr(1, 4), nullptr, 16));
                  id(uart_send) = 0;
                  break;
                }
                case 12: {
                  id(firmware)=data_from_server.substr(1, 4);
                  id(duepi_firmware).publish_state(id(firmware));
                  id(uart_send) = 0;
                  break;
                }
                case 13: {
                  id(total_burn_time).publish_state(std::stoi(data_from_server.substr(1, 6), nullptr, 16));
                  id(uart_send) = 0;
                  break;
                }
                case 14: {
                  id(burn_time).publish_state(std::stoi(data_from_server.substr(1, 6), nullptr, 16));
                  id(uart_send) = 0;
                  break;
                }
                case 15: {
                  const int param = id(installer_pending_param);
                  const int value = std::stoi(data_from_server.substr(1, 2), nullptr, 16);
                  id(installer_value_number).publish_state(value);
                  id(installer_status).publish_state(
                      "Read PR" + std::to_string(param) + " = " + std::to_string(value));
                  id(installer_pending_param) = -1;
                  id(installer_pending_value) = -1;
                  id(uart_send) = 0;
                  break;
                }
                case 16: {
                  const int param = id(installer_pending_param);
                  const int value = id(installer_pending_value);
                  if (data_from_server.substr(1, 6) == "000000") {
                    id(installer_status).publish_state(
                        "Write PR" + std::to_string(param) + " = " + std::to_string(value) + " acknowledged");
                  } else {
                    id(installer_status).publish_state(
                        "Write PR" + std::to_string(param) + " unexpected response " + data_from_server);
                  }
                  id(installer_pending_param) = -1;
                  id(installer_pending_value) = -1;
                  id(uart_send) = 0;
                  break;
                }
                case 17: {
                  std::string inputs_state = data_from_server.substr(1, 4);
                  if (inputs_state == "0100") {
                    status = "Sealed";
                  } else if (inputs_state == "0300") {
                    status = "Pressure loss";
                  } else if (inputs_state == "0800") {
                    status = "Ok (Standby)";
                  } else {
                    status = "Unknown " + inputs_state;
                    id(debug).publish_state("Unknown hopper seal state :" + data_from_server);
                  }
                  id(pressure_switch_status).publish_state(status);
                  id(uart_send) = 0;
                  break;
                }
                case 18: {
                  std::string board_type_raw = data_from_server.substr(1, 2);
                  if (board_type_raw == "00") {
                    status = "Air";
                  } else if (board_type_raw == "01") {
                    status = "Hydro";
                  } else {
                    status = "Unknown " + data_from_server.substr(1, 4);
                  }
                  id(duepi_board_type).publish_state(status);
                  id(uart_send) = 0;
                  break;
                }
                default: {
                  id(debug_rx).publish_state(data_from_server);
                  id(debug).publish_state("Unknown UART command :"+id(uart_send));
                  id(installer_pending_param) = -1;
                  id(installer_pending_value) = -1;
                  id(uart_send) = 0;
                }
              }
            } else {
                if (id(uart_send) == 15) {
                  const int param = id(installer_pending_param);
                  id(installer_status).publish_state(
                      "Read PR" + std::to_string(param) + " failed: checksum error");
                } else if (id(uart_send) == 16) {
                  const int param = id(installer_pending_param);
                  id(installer_status).publish_state(
                      "Write PR" + std::to_string(param) + " failed: checksum error");
                } else {
                  id(debug_rx).publish_state(data_from_server);
                  id(debug).publish_state("Error checksum failed :"+data_from_server);
                }
                id(installer_pending_param) = -1;
                id(installer_pending_value) = -1;
                id(uart_send) = 0;
              }
